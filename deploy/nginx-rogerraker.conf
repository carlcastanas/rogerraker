# /etc/nginx/sites-available/rogerraker
#
# Replace DOMAIN_HERE with the real domain (both occurrences) before installing.
# Install HTTP-only first, then let certbot add the TLS block:
#   sudo ln -s /etc/nginx/sites-available/rogerraker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN_HERE -d www.DOMAIN_HERE
#
# This file only ever mentions its own server_name, so it cannot affect the
# joshmojica.io server block already on this box.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_HERE www.DOMAIN_HERE;

    # Uploaded and generated files can get large; keep the default modest.
    client_max_body_size 25M;

    # Next.js build assets are content-hashed and safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
