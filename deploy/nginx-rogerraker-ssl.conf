# HTTPS block, appended by finish-setup.sh once a certificate is installed.
#
# The origin only ever receives traffic from Cloudflare, so the cleanest
# certificate here is a Cloudflare Origin Certificate: free, valid 15 years, no
# renewal job, and no ACME challenge to fight the proxy over. Create it at
# SSL/TLS > Origin Server > Create Certificate, then save the two blocks as
#   /etc/ssl/cloudflare/rogerraker.pem   (certificate)
#   /etc/ssl/cloudflare/rogerraker.key   (private key)
# It is trusted only by Cloudflare, which is exactly right: the firewall already
# refuses everyone else. Pair it with SSL/TLS mode "Full (strict)".

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rogerraker.com www.rogerraker.com;

    ssl_certificate     /etc/ssl/cloudflare/rogerraker.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/rogerraker.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25M;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
